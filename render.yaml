services:
  - type: web
    name: luxora-ecom
    runtime: static
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && PORT=10000 BASE_PATH=/ pnpm --filter @workspace/luxora build
    staticPublishPath: ./artifacts/luxora/dist/public
    envVars:
      - key: PORT
        value: "10000"
      - key: BASE_PATH
        value: "/"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
